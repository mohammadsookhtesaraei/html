<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heading</title>
</head>
<body>

    <!-- Heading hierarchy را بر اساس ساختار محتوا انتخاب کن، نه بر اساس ظاهر. -->

    <!-- اسکرین ریدر ها خیلی مهمه این موضوع یا همون دسترسی پذیری -->
    <!-- چون ترتیب براش مهمه اسکرین ریدر  -->
    <!-- heading -->
    <h1></h1>
    <h2></h2>
    <h3></h3>
    <h4></h4>
    <h5></h5>
    <h6></h6>

    <!-- example -->

    <div>
        <h1>welcome</h1>
        <h2>home</h2>
        <p>this is a home tage.</p>
    </div>

    <!-- example 2 -->

    <div>
        <h1>my shopping</h1>

        <h2>products</h2>

        <h3>laptop</h3>

        <h4>gaming laptop</h4>

        <h5>information</h5>

        <h6>more details</h6>
    </div>

    <!-- example -->

    <div>
        <h1>my products</h1>

        <h2>new products</h2>
        <h2>popular products</h2>
    </div>

</body>
</html>
