<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>paragrap - br - hr</title>
</head>

<body>
    <!-- paragraph -->
    <p></p>

    <!-- br-line break -->
    <!-- این مخصوص شکستن متن هست برای ایجاد فاصله بین المان ها از سی اس اس استفاده شود -->
    <br>

    <!-- hr - a paragraph-level thematic break-->
    یعنی یک تغییر موضوع یا بخش محتوایی داریم.
    <!-- برای جدا سازی ضاهری بین محتوا ها از بردر در سی اس اس استفاده کنیم -->
    <!-- اچ ار میاد یک بخش رو جدا میکنه توی  محتوای المان -->
    <hr>

    <!-- exapmle -->

    <div>
        <h1>my shop</h1>
        <p>this is my shop</p>
    </div>

    <!-- example 2 -->
    <div>
        <h1>my shop</h1>
        <p>hello
            <br>
            this is my shopping
        </p>
    </div>

    <div>
        <h2>مشخصات محصول</h2>

        <p>پردازنده: Core i7</p>

        <hr>

        <h2>نظرات کاربران</h2>
    </div>
</body>

</html>
